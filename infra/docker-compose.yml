# Pin the compose project name so network/resource prefixes don't depend on
# the checkout directory name ("infra" inside the openmentor monorepo).
name: openmentor

services:
  # Traefik reverse proxy for SSL/TLS termination
  # v3.7: negotiates the Docker API version, required for Docker Engine >= 29
  # (v2.10 pins API 1.24 and cannot connect).
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: always
    mem_limit: 256m
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Only route containers belonging to THIS compose project. The Docker
      # provider watches the whole daemon, not just our stack, so any other
      # compose project on the host that happens to name a router "frontend"
      # (getmentor.dev's stack does) collides with ours — and Traefik resolves
      # a duplicate router name by dropping it entirely, taking the site down
      # with a bare 404. Safe to pin the literal: the project name comes from
      # `name: openmentor` at the top of this file, not the directory name.
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`openmentor`)"
      - "--entrypoints.web.address=:80"
      # Redirect HTTP to HTTPS globally, at the entrypoint rather than via a
      # catch-all router. This replaces the old `http-catchall` labels on this
      # container, which were dead config twice over: the rule used the v2
      # `hostregexp({host:.+})` named-group syntax that v3 dropped (v3 regexp
      # matchers are Go regexp), AND labels on this container were never read
      # at all — exposedbydefault=false means the docker provider only builds
      # routers for containers carrying `traefik.enable=true`, which this one
      # does not. Net effect before this change: plain HTTP was served, not
      # redirected. Entrypoint redirection is static config, so it applies
      # regardless of provider label filtering and involves no rule syntax.
      #
      # Safe to redirect all of :80 because ACME uses the DNS-01 challenge
      # below; an HTTP-01 challenge would need /.well-known/acme-challenge
      # excluded from this redirect.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Uncomment for staging/testing Let's Encrypt certificates
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      # Uncomment to expose Traefik dashboard (secure it properly!)
      # - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    networks:
      - openmentor-network

  # cAdvisor for container resource monitoring
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    mem_limit: 256m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - openmentor-network


  # Next.js Frontend
  frontend:
    image: ${ECR_REGISTRY}/openmentor-frontend:${FRONTEND_IMAGE_TAG:-${IMAGE_TAG}}
    container_name: openmentor-frontend
    restart: always
    mem_limit: 768m
    # SECURITY (P10): explicit allowlist, never the shared env file. This
    # container is the only internet-facing process in the stack and it shares
    # a network with postgres, so a frontend RCE must not also hand over the
    # database DSN, JWT_SECRET, WORKER_AUTH_TOKEN, SES/S3/backup keys, the
    # Cloudflare DNS token or the Grafana Cloud key. Bare `- KEY` entries take
    # the value from .env and stay UNSET when .env has no such line (a
    # `KEY=${KEY}` entry would inject an empty string instead).
    # Contract + rationale per key: ENVIRONMENT_VARIABLES.md; enforced by
    # ./check-service-env.sh against env-allowlist.txt.
    environment:
      - NODE_ENV=production
      - APP_ENV=${APP_ENV:-production}
      - PORT=3000
      - SERVICE_INSTANCE_ID=${HOSTNAME}
      - LOG_LEVEL
      - LOG_DIR
      - DOMAIN # src/config/constants.ts derives BASE_URL from it
      # Server-side secrets the BFF genuinely needs
      - GO_API_INTERNAL_TOKEN # sent to the Go API as the internal caller token
      - METRICS_AUTH_TOKEN # guards /api/metrics, which alloy scrapes
      # Server-side OpenTelemetry
      - O11Y_EXPORTER_ENDPOINT
      - O11Y_FE_SERVICE_NAME
      - O11Y_FE_SERVICE_VERSION
      - O11Y_SERVICE_NAMESPACE
      # NEXT_PUBLIC_* are resolved at BUILD time only: web/ builds with
      # `output: 'standalone'`, whose generated server.js inlines the whole
      # next.config.js result (remotePatterns, the Faro rewrite) as a literal,
      # so `node server.js` never re-evaluates the config file. Kept here
      # anyway so the runtime env matches the build args an operator sets in
      # .env - all of them are public by definition, they already ship in the
      # browser bundle.
      - NEXT_PUBLIC_GO_API_URL=http://backend:8081
      - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-production}
      - NEXT_PUBLIC_ANALYTICS_PROVIDER=${NEXT_PUBLIC_ANALYTICS_PROVIDER:-posthog}
      - NEXT_PUBLIC_ANALYTICS_EVENT_VERSION=${NEXT_PUBLIC_ANALYTICS_EVENT_VERSION:-v1}
      - NEXT_PUBLIC_S3_STORAGE_ENDPOINT
      - NEXT_PUBLIC_S3_STORAGE_BUCKET
      - NEXT_PUBLIC_CDN_ENDPOINT
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY
      - NEXT_PUBLIC_O11Y_SERVICE_NAMESPACE
      - NEXT_PUBLIC_O11Y_FE_SERVICE_VERSION
      - NEXT_PUBLIC_POSTHOG_KEY
      - NEXT_PUBLIC_POSTHOG_HOST
      - NEXT_PUBLIC_FARO_COLLECTOR_URL
      - NEXT_PUBLIC_FARO_APP_NAME
      - NEXT_PUBLIC_FARO_SAMPLE_RATE
    networks:
      - openmentor-network
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # No `web` (HTTP) router: the web entrypoint now 301s everything to
      # websecure before routing, so a plaintext router here would be
      # unreachable. It is also what previously served the site over plain
      # HTTP — its rule is longer than the old catch-all's, and Traefik breaks
      # priority ties by rule length, so it won every :80 request for the
      # canonical domain.
      # HTTPS router — apex only; www is redirected to it below, so both
      # hostnames don't serve identical content (duplicate content for SEO).
      - "traefik.http.routers.frontend-secure.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.routers.frontend-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # SECURITY (L10): edge HSTS + security headers and a real per-client-IP
      # rate limit at the reverse proxy (the Go API sees only the BFF's IP, so
      # true per-client limiting must live here). The headers middleware adds
      # HSTS; the app's own CSP/X-Frame-Options (next.config.js) still apply.
      - "traefik.http.routers.frontend-secure.middlewares=sec-headers,edge-ratelimit"
      - "traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.edge-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.edge-ratelimit.ratelimit.burst=50"
      # Separate router so www still resolves TLS (own cert) before the 301 to apex.
      - "traefik.http.routers.frontend-www.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.frontend-www.entrypoints=websecure"
      - "traefik.http.routers.frontend-www.tls=true"
      - "traefik.http.routers.frontend-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-www.middlewares=www-redirect"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.${DOMAIN}/(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://${DOMAIN}/$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"

  # PostgreSQL database (containerized on the VM per DECISIONS D2)
  # Data lives in the external volume `openmentor-postgres-data`, created by
  # deploy.sh (`docker volume create`) so that `docker compose down -v` can
  # never delete the production database. No published ports — admin access
  # is `docker exec -it openmentor-postgres psql ...` (see
  # ../docs/runbooks/postgres-backup-restore.md).
  postgres:
    image: postgres:16.14-alpine
    container_name: openmentor-postgres
    restart: always
    mem_limit: 512m
    # pg_stat_statements is required by Grafana Cloud Database Observability
    # (../docs/runbooks/database-observability.md). shared_preload_libraries
    # only applies on restart; the extension itself is created once via SQL.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_activity_query_size=4096
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-openmentor}
      # No default on purpose: the container refuses to initialize without it
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-openmentor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - openmentor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmentor} -d ${POSTGRES_DB:-openmentor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nightly logical backups of the postgres container (pg_dump -Fc): shipped
  # to S3 when BACKUP_S3_BUCKET is set, otherwise kept in the local
  # openmentor-postgres-backups volume with a loud warning. Built on the VM
  # from ./postgres-backup (docker-compose builds it on first `up`).
  # Restore procedure: ../docs/runbooks/postgres-backup-restore.md
  postgres-backup:
    build:
      context: ./postgres-backup
    image: openmentor-postgres-backup:local
    container_name: openmentor-postgres-backup
    restart: always
    mem_limit: 256m
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-openmentor}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-openmentor}
      - BACKUP_TIME=${BACKUP_TIME:-03:30}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-postgres}
      # Dedicated backup credentials (SECURITY M12): REQUIRED when
      # BACKUP_S3_BUCKET is set. backup.sh no longer falls back to the app's
      # S3_STORAGE_* keys and fails fast if these are missing - see .env.example
      - BACKUP_AWS_ACCESS_KEY_ID=${BACKUP_AWS_ACCESS_KEY_ID:-}
      - BACKUP_AWS_SECRET_ACCESS_KEY=${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      - BACKUP_AWS_REGION=${BACKUP_AWS_REGION:-}
      - BACKUP_MAX_AGE_HOURS=${BACKUP_MAX_AGE_HOURS:-26}
    volumes:
      - postgres-backups:/backups
      # Prometheus textfile metrics (backup freshness); alloy mounts this
      # read-only and scrapes it. Separate from the dumps volume on purpose -
      # alloy has no business reading full database dumps.
      - backup-metrics:/var/lib/backup-metrics
    networks:
      - openmentor-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The daemon loop swallows per-run failures on purpose (a transient
      # error must not kill the sidecar), so staleness of the success marker
      # is the signal: unhealthy once the last successful dump is older than
      # BACKUP_MAX_AGE_HOURS. deploy-remote.sh/rollback.sh read
      # .State.Health.Status, NOT just .State.Status: docker keeps an unhealthy
      # container in state "running", which made this healthcheck invisible to
      # both deploy gates. Unhealthy now ends those runs non-zero (exit 2)
      # WITHOUT rolling back application images - an aging dump is a paging
      # matter (grafana/alerting/alert-rules.yaml), not a reason to revert
      # working code. "starting" (start_period below) and a VM whose compose
      # file predates this healthcheck both still pass.
      test: ["CMD", "/usr/local/bin/backup.sh", "healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30s

  # Database Migration Service (runs once before backend starts)
  migrate:
    image: ${ECR_REGISTRY}/openmentor-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG}}
    container_name: openmentor-migrate
    mem_limit: 256m
    command: ["/app/migrate"]
    # SECURITY (P10): explicit allowlist. cmd/migrate only needs DATABASE_URL,
    # but it calls the shared config.Load(), whose Validate() rejects a missing
    # INTERNAL_MENTORS_API / MENTORS_API_LIST_AUTH_TOKEN / TURNSTILE_SECRET_KEY
    # / JWT_SECRET / WORKER_AUTH_TOKEN / POSTHOG_API_KEY — dropping those makes
    # this container exit 1, and `depends_on: service_completed_successfully`
    # then blocks the backend entirely. They are passed to satisfy validation
    # and nothing else; trimming them needs a per-binary validation profile in
    # api/config (follow-up, not an infra change). No S3, SES or observability
    # credentials reach this container.
    environment:
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - DATABASE_URL=${DATABASE_URL}
      - DB_WORK_OFFLINE
      # validation-only below
      - BASE_URL
      - ALLOWED_CORS_ORIGINS
      - INTERNAL_MENTORS_API
      - MENTORS_API_LIST_AUTH_TOKEN
      - TURNSTILE_SECRET_KEY
      - JWT_SECRET
      - WORKER_AUTH_TOKEN
      - ANALYTICS_PROVIDER
      - ANALYTICS_EVENT_VERSION
      - POSTHOG_ENABLED
      - POSTHOG_API_KEY
      - POSTHOG_HOST
      - POSTHOG_CAPTURE_ENDPOINT
    networks:
      - openmentor-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"  # Run once and exit
    volumes:
      - backend-logs:/app/logs

  # Go API Backend (internal only, no public access)
  backend:
    image: ${ECR_REGISTRY}/openmentor-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG}}
    container_name: openmentor-backend
    restart: always
    mem_limit: 512m
    # SECURITY (P10): explicit allowlist covering api/config/config.go's viper
    # bindings for cmd/api. Deliberately absent: SES_* and the email settings
    # (worker-only — cfg.Email has no reader in cmd/api), POSTGRES_PASSWORD,
    # BACKUP_*, GCLOUD_*, POSTGRES_OBS_DSN, CLOUDFLARE_DNS_API_TOKEN,
    # METRICS_AUTH_TOKEN, GO_API_INTERNAL_TOKEN and every deploy/build-only var.
    environment:
      - GIN_MODE=release
      - PORT=8081
      # Go's GC targets ~2x live heap and does not read the cgroup limit, so a
      # 200 MiB live heap makes it reach for ~400 MiB and the kernel OOM-kills
      # the container while nothing is actually leaking. GOMEMLIMIT is the soft
      # limit that makes the GC back off first; keep it ~20% under mem_limit so
      # non-heap memory (stacks, mmap'd runtime) still fits.
      - GOMEMLIMIT=400MiB
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - SERVICE_INSTANCE_ID=${HOSTNAME}
      - DATABASE_URL=${DATABASE_URL}
      - DB_WORK_OFFLINE
      - BASE_URL
      - ALLOWED_CORS_ORIGINS
      - TRUSTED_PROXIES
      # Profile images
      - S3_STORAGE_ACCESS_KEY
      - S3_STORAGE_SECRET_KEY
      - S3_STORAGE_BUCKET
      - S3_STORAGE_ENDPOINT
      - S3_STORAGE_REGION
      # Auth
      - INTERNAL_MENTORS_API
      - MENTORS_API_LIST_AUTH_TOKEN
      - TURNSTILE_SECRET_KEY
      - JWT_SECRET
      - JWT_ISSUER
      - SESSION_TTL_HOURS
      - LOGIN_TOKEN_TTL_MINUTES
      - COOKIE_DOMAIN
      - COOKIE_SECURE
      # Worker triggers (X-Worker-Token + the /jobs/* URLs the API calls)
      - WORKER_AUTH_TOKEN
      - MENTOR_CREATED_TRIGGER_URL
      - MENTOR_UPDATED_TRIGGER_URL
      - MENTOR_REQUEST_CREATED_TRIGGER_URL
      - MENTOR_LOGIN_EMAIL_TRIGGER_URL
      - MODERATOR_LOGIN_EMAIL_TRIGGER_URL
      - MENTOR_MODERATION_TRIGGER_URL
      - REQUEST_PROCESS_FINISHED_TRIGGER_URL
      - REVIEW_CREATED_TRIGGER_URL
      # Server-side product analytics
      - ANALYTICS_PROVIDER
      - ANALYTICS_EVENT_VERSION
      - POSTHOG_ENABLED
      - POSTHOG_API_KEY
      - POSTHOG_HOST
      - POSTHOG_CAPTURE_ENDPOINT
      - POSTHOG_DISABLE_GEOIP
      # Observability
      - O11Y_EXPORTER_ENDPOINT
      - O11Y_BE_SERVICE_NAME
      - O11Y_BE_SERVICE_VERSION
      - O11Y_SERVICE_NAMESPACE
      - O11Y_PROFILING_ENABLED
      - O11Y_PROFILING_ENDPOINT
      - O11Y_PROFILING_APP_NAME
      - O11Y_PROFILING_SAMPLE_TYPES
      - O11Y_PROFILING_UPLOAD_INTERVAL_SECONDS
    networks:
      - openmentor-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Go Background Worker (internal only, no public access)
  # Same image as the backend; runs /app/worker (async event triggers from
  # the API via /jobs/* plus the daily cron jobs). Replaces the deprecated
  # openmentor-func Azure Functions app.
  worker:
    image: ${ECR_REGISTRY}/openmentor-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG}}
    container_name: openmentor-worker
    restart: always
    mem_limit: 256m
    command: ["/app/worker"]
    # SECURITY (P10): explicit allowlist. The worker is the only container that
    # sends email, so it is the only one holding SES_*. Deliberately absent:
    # S3_STORAGE_* (cmd/api only), the trigger URLs (it *serves* those routes),
    # POSTGRES_PASSWORD, BACKUP_*, GCLOUD_*, CLOUDFLARE_DNS_API_TOKEN,
    # METRICS_AUTH_TOKEN, GO_API_INTERNAL_TOKEN.
    environment:
      - GIN_MODE=release
      - WORKER_PORT=8090
      # Same reason as backend, sized to THIS container: the value has to sit
      # under mem_limit or the GC never backs off before the kernel kills the
      # process. 256m here, so 200MiB — not the backend's 400MiB.
      - GOMEMLIMIT=200MiB
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - SERVICE_INSTANCE_ID=${HOSTNAME}
      - DATABASE_URL=${DATABASE_URL}
      - DB_WORK_OFFLINE
      - BASE_URL # rendered into email links
      - ALLOWED_CORS_ORIGINS
      # Worker itself
      - WORKER_AUTH_TOKEN
      - WORKER_CRON_ENABLED
      - WORKER_DB_MAX_CONNS
      - HIGHLIGHTED_MENTORS
      # Transactional email (AWS SES v2)
      - SES_REGION
      - SES_ACCESS_KEY_ID
      - SES_SECRET_ACCESS_KEY
      - SES_ENDPOINT
      - MODERATORS_EMAIL
      - DISCORD_MENTORS_PRIVATE_INVITE_LINK
      - DEV_EMAIL_OVERRIDE
      # Server-side product analytics
      - ANALYTICS_PROVIDER
      - ANALYTICS_EVENT_VERSION
      - POSTHOG_ENABLED
      - POSTHOG_API_KEY
      - POSTHOG_HOST
      - POSTHOG_CAPTURE_ENDPOINT
      - POSTHOG_DISABLE_GEOIP
      # Observability (cfg.Observability.ServiceVersion reads O11Y_BE_SERVICE_VERSION
      # for both binaries; the worker's identity is O11Y_WORKER_SERVICE_NAME)
      - O11Y_EXPORTER_ENDPOINT
      - O11Y_WORKER_SERVICE_NAME
      - O11Y_BE_SERVICE_VERSION
      - O11Y_SERVICE_NAMESPACE
      - O11Y_PROFILING_ENABLED
      - O11Y_PROFILING_ENDPOINT
      - O11Y_PROFILING_SAMPLE_TYPES
      - O11Y_PROFILING_UPLOAD_INTERVAL_SECONDS
      # Validation-only (config.Validate() is shared with cmd/api; the worker
      # reads none of these — see the migrate service comment)
      - INTERNAL_MENTORS_API
      - MENTORS_API_LIST_AUTH_TOKEN
      - TURNSTILE_SECRET_KEY
      - JWT_SECRET
    networks:
      - openmentor-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - worker-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Grafana Alloy for observability
  alloy:
    # >= 1.17.0 required by database_observability.postgres (Grafana Cloud
    # Database Observability); see ../docs/runbooks/database-observability.md
    image: grafana/alloy:v1.18.0
    container_name: grafana-alloy
    restart: always
    mem_limit: 512m
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Mount log directories from frontend, backend and worker for tailing
      - frontend-logs:/var/log/frontend:ro
      - backend-logs:/var/log/backend:ro
      - worker-logs:/var/log/worker:ro
      # Database observability secrets (created by deploy.sh, never committed)
      # Contains: postgres_secret_openmentor (DSN)
      - ./alloy-secrets:/var/lib/alloy/secrets:ro
      # Backup freshness gauges written by the postgres-backup sidecar,
      # scraped via prometheus.exporter.unix's textfile collector
      - backup-metrics:/var/lib/alloy/backup-metrics:ro
    # SECURITY (P10): explicit allowlist — every sys.env() read in
    # alloy/config.alloy and nothing else. Alloy holds the Grafana Cloud write
    # key and the monitoring DSN; it has no business holding the app's DATABASE_URL,
    # JWT_SECRET, WORKER_AUTH_TOKEN, SES/S3/backup keys or the Cloudflare token.
    environment:
      - APP_ENV=${APP_ENV:-production}
      # Stable per-VM label on the backup gauges; deploy.sh writes it from the
      # deploy target because production and --staging share .env.production
      - DEPLOYMENT_NAME=${DEPLOYMENT_NAME:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=8081
      - WORKER_PORT=8090
      - PROMETHEUS_SCRAPE_INTERVAL
      - GCLOUD_HOSTED_METRICS_URL=${GCLOUD_HOSTED_METRICS_URL}
      - GCLOUD_HOSTED_METRICS_ID=${GCLOUD_HOSTED_METRICS_ID}
      - GCLOUD_HOSTED_LOGS_URL=${GCLOUD_HOSTED_LOGS_URL}
      - GCLOUD_HOSTED_LOGS_ID=${GCLOUD_HOSTED_LOGS_ID}
      - GCLOUD_HOSTED_TRACES_URL=${GCLOUD_HOSTED_TRACES_URL}
      - GCLOUD_HOSTED_TRACES_ID=${GCLOUD_HOSTED_TRACES_ID}
      - GCLOUD_HOSTED_PROFILES_URL=${GCLOUD_HOSTED_PROFILES_URL}
      - GCLOUD_HOSTED_PROFILES_ID=${GCLOUD_HOSTED_PROFILES_ID}
      - GCLOUD_RW_API_KEY=${GCLOUD_RW_API_KEY}
      - O11Y_BE_SERVICE_NAME=${O11Y_BE_SERVICE_NAME}
      - O11Y_FE_SERVICE_NAME=${O11Y_FE_SERVICE_NAME}
      - O11Y_WORKER_SERVICE_NAME=${O11Y_WORKER_SERVICE_NAME}
      - O11Y_SERVICE_NAMESPACE=${O11Y_SERVICE_NAMESPACE}
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN}
      - POSTGRES_OBS_DSN=${POSTGRES_OBS_DSN}
    networks:
      - openmentor-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      worker:
        condition: service_healthy

networks:
  openmentor-network:
    driver: bridge
    # Network is NOT internal - frontend needs internet access for external APIs
    # Security is enforced by:
    # 1. Only frontend exposed via Traefik
    # 2. Backend, Worker and Alloy have no port mappings
    # 3. Traefik configured with proper routing rules

volumes:
  traefik-certificates:
    name: traefik-letsencrypt-certificates
  postgres-data:
    # Created out-of-band by deploy.sh (`docker volume create
    # openmentor-postgres-data`). Declared external so compose does not own
    # it and `docker compose down -v` can never delete the database.
    name: openmentor-postgres-data
    external: true
  postgres-backups:
    # Local fallback destination for dumps when BACKUP_S3_BUCKET is unset,
    # and scratch space for the dump before its S3 upload
    name: openmentor-postgres-backups
  backup-metrics:
    # Prometheus textfile metrics: written by postgres-backup, read-only in alloy
    name: openmentor-backup-metrics
  frontend-logs:
    name: openmentor-frontend-logs
  backend-logs:
    name: openmentor-backend-logs
  worker-logs:
    name: openmentor-worker-logs
  alloy-data:
    name: grafana-alloy-data
