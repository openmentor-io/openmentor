name: CI / API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/ci-api.yml'

  # Allows manual trigger from Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

defaults:
  run:
    working-directory: api

# SECURITY (L6): least-privilege default token for this workflow.
permissions:
  contents: read

# Linting is NOT here: golangci-lint runs in checks.yml ("required-checks") so
# it gates every PR. `go vet` is gone from the test job for the same reason —
# golangci-lint's govet (enable-all) is a superset of it.

jobs:
  # Race tests + coverage floor + binary builds
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Two facts live in SQL and in pgx, where no fake can model them: the
    # worker's registration-finalization claim (an UPDATE whose WHERE Postgres
    # re-evaluates against the winning writer's row) and pgx's refusal to decode
    # a NULL into a non-pointer destination, which is what makes an
    # un-COALESCEd nullable column unreadable. The tests for both skip when
    # OPENMENTOR_TEST_DATABASE_URL is unset, which is why they run in this deep
    # job rather than the fast required-checks gate. Throwaway credentials, not
    # secrets.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openmentor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: openmentor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U openmentor -d openmentor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests with race detector and coverage
        env:
          OPENMENTOR_TEST_DATABASE_URL: postgres://openmentor:ci@127.0.0.1:5432/openmentor_test?sslmode=disable
        run: |
          # -coverpkg measures coverage across all packages, not just test packages
          go test -race -timeout=5m -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
          go tool cover -func=coverage.out

      - name: Check test coverage
        run: |
          # If coverage.out is missing or empty, treat coverage as 0
          if [ ! -s coverage.out ]; then
            echo "No coverage data produced."
            coverage=0
          else
            coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | sed 's/%//')
            if [ -z "$coverage" ]; then
              coverage=0
            fi
          fi

          echo "Total coverage: ${coverage}%"

          # Set minimum coverage threshold (currently lenient, increase over time)
          threshold=10

          if (( $(echo "$coverage < $threshold" | bc -l) )); then
            echo "Coverage ${coverage}% is below threshold ${threshold}%"
            exit 1
          else
            echo "Coverage ${coverage}% meets threshold ${threshold}%"
          fi

      - name: Build all binaries (api, worker, migrate)
        run: |
          go build -v ./cmd/api
          go build -v ./cmd/worker
          go build -v ./cmd/migrate

  # gosec -> SARIF -> Security tab, plus a gate on HIGH-severity findings.
  #
  # This job used to be a permanent green no-op (H6): the workflow-level
  # `permissions: contents: read` gave it no `security-events: write`, so every
  # upload-sarif call failed — and `continue-on-error: true` swallowed that,
  # while `-no-fail` swallowed the findings themselves. Nothing ever reached the
  # Security tab that README.md advertised.
  #
  # Not a duplicate of the merge gate: golangci-lint in "Checks /
  # required-checks" already runs gosec at medium severity/confidence over
  # non-test code with G104/G115 excluded, and that is what BLOCKS a merge. This
  # job adds what that cannot — the Security-tab report, test files, and the
  # excluded rules — so its own gate is scoped to HIGH findings.
  security:
    name: Security Checks
    runs-on: ubuntu-latest

    # SECURITY (H6): scoped to this job rather than raised workflow-wide — it is
    # the only job that uploads code-scanning results.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      # The gosec action runs from the repo root, so scope it to ./api/...
      # -no-fail keeps the SCAN from deciding the build: the verdict is the
      # baseline gate below, which distinguishes new HIGH findings from the
      # reviewed ones. It also tolerates gosec's SSA-analyzer panic on recent Go
      # (a recovered upstream tool bug that doesn't affect rule-based findings)
      # — without it that panic alone would fail the job and no SARIF would be
      # written at all.
      - name: Run Gosec Security Scanner
        uses: securego/gosec@6be2b51fd78feca86af91f5186b7964d76cb1256 # v2.22.10
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./api/...'

      # gosec 2.22.x attaches an autofix suggestion as
      # `fixes: [{description: ..., artifactChanges: null}]` on some rules (G304
      # here), and GitHub's SARIF schema validation rejects the whole file for it
      # ("artifactChanges is not of a type(s) array"). That is an upstream bug,
      # not a finding, and `fixes` carries no security information — dropping it
      # is lossless for code scanning. This is the class of failure
      # `continue-on-error` used to hide.
      - name: Normalize the gosec SARIF
        working-directory: .
        run: |
          jq '(.runs[]?.results[]?) |= del(.fixes)' results.sarif > results.clean.sarif
          mv results.clean.sarif results.sarif

      # No continue-on-error: an upload that cannot happen is the H6 bug itself.
      # Skipped only for fork PRs, whose GITHUB_TOKEN is read-only no matter
      # what this job requests — the gate below still runs there.
      #
      # CodeQL *default setup* is enabled on this repo (languages: actions, go,
      # javascript-typescript) and a repository ruleset requires its results on
      # main. That rule names the CodeQL tool specifically, so these gosec
      # results are a second, independent tool: they show up in the Security tab
      # and do not feed the CodeQL merge-protection rule. Uploading under a
      # different tool name is also why this does not collide with default setup
      # the way a second CodeQL analysis would.
      - name: Upload SARIF file
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: results.sarif

      # Fails on any HIGH finding that is not in api/gosec-baseline.txt, so the
      # three reviewed pre-existing ones stay green and a NEW one goes red.
      # Same script as `make security-sarif-gate` locally.
      - name: Gate on new HIGH findings
        if: ${{ !cancelled() }}
        run: make security-sarif-gate SARIF=../results.sarif

  # Docker image build + full-stack smoke test
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          load: true
          tags: openmentor-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the full stack from the built image: postgres -> migrations ->
      # api -> worker, then smoke-tests health, metrics, and worker auth.
      - name: Smoke test image (migrate + api + worker against Postgres)
        run: |
          set -euo pipefail
          IMAGE=openmentor-api:${{ github.sha }}
          DBURL='postgres://openmentor:ci@pg:5432/openmentor?sslmode=disable'

          docker network create ci-net

          # All three binaries (migrate, api, worker) load the same config,
          # which hard-requires these vars in production (APP_ENV defaults to
          # production) — including JWT_SECRET (>=32 chars) and WORKER_AUTH_TOKEN
          # per the security hardening. Share one env file so they can't drift.
          #
          # The S3_STORAGE_* block must be COMPLETE or config validation fails
          # in production; the values are unused here because NewStorageClient
          # makes no network call and the smoke test uploads nothing.
          printf '%s\n' \
            "DATABASE_URL=$DBURL" \
            'INTERNAL_MENTORS_API=test-token' \
            'MENTORS_API_LIST_AUTH_TOKEN=test-token-1' \
            'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA' \
            'JWT_SECRET=ci-jwt-secret-not-a-real-secret-0123456789' \
            'WORKER_AUTH_TOKEN=ci-worker-token' \
            'S3_STORAGE_ACCESS_KEY=ci-access-key' \
            'S3_STORAGE_SECRET_KEY=ci-secret-key' \
            'S3_STORAGE_BUCKET=ci-bucket' \
            'S3_STORAGE_ENDPOINT=http://s3.invalid' \
            'S3_STORAGE_REGION=auto' \
            > ci.env

          docker run -d --name pg --network ci-net \
            -e POSTGRES_USER=openmentor -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=openmentor \
            postgres:16-alpine
          # -h 127.0.0.1 forces a TCP check. Without it pg_isready uses the
          # unix socket, which the entrypoint's bootstrap server (started with
          # listen_addresses='' to run initdb) already answers — so the wait
          # loop breaks before Postgres listens on TCP and the migrate
          # container below gets ECONNREFUSED.
          for i in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U openmentor -d openmentor && break
            [ "$i" = 30 ] && { echo "postgres never became ready"; exit 1; }
            sleep 1
          done

          echo "--- running migrations"
          docker run --rm --network ci-net --env-file ci.env "$IMAGE" /app/migrate

          echo "--- starting api"
          docker run -d --name api --network ci-net -p 8081:8081 \
            --env-file ci.env \
            "$IMAGE"

          echo "--- starting worker"
          docker run -d --name worker --network ci-net -p 8090:8090 \
            --env-file ci.env \
            "$IMAGE" /app/worker

          wait_for() {
            local url=$1
            for i in $(seq 1 30); do
              curl -fsS "$url" >/dev/null && return 0
              sleep 1
            done
            echo "timed out waiting for $url"
            return 1
          }

          echo "--- api health + metrics"
          wait_for http://localhost:8081/api/healthcheck || { docker logs api; exit 1; }
          curl -f http://localhost:8081/api/metrics | grep -E "(http_server_|openmentor_|process_runtime_)" || { docker logs api; exit 1; }

          echo "--- worker health + metrics + auth"
          wait_for http://localhost:8090/healthz || { docker logs worker; exit 1; }
          curl -f http://localhost:8090/metrics >/dev/null || { docker logs worker; exit 1; }
          # /jobs must reject requests without the worker token...
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8090/jobs/mentor-login-email)
          [ "$code" = "401" ] || { echo "expected 401 without token, got $code"; docker logs worker; exit 1; }
          # ...and accept the token (404 = passed auth, unknown mentor id is fine for a smoke test)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "X-Worker-Token: ci-worker-token" -H "Content-Type: application/json" \
            -d '{"type":"mentor_login","mentor_id":"00000000-0000-0000-0000-000000000000","login_url":"https://example.com"}' \
            http://localhost:8090/jobs/mentor-login-email)
          case "$code" in 200|404) ;; *) echo "expected 200/404 with token, got $code"; docker logs worker; exit 1;; esac

          echo "--- logs (for the record)"
          docker logs api
          docker logs worker

          docker rm -f api worker pg
          docker network rm ci-net
