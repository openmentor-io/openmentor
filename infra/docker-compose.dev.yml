# Development overrides for docker-compose.yml
#
# Dev/prod parity: the merged stack runs the SAME service set as production —
# traefik / frontend / backend / worker / migrate / postgres — with local
# image tags and dev credentials. Differences from production:
#
#   - traefik runs HTTP-only on :80 (no ACME/Cloudflare DNS, no :443) and
#     routes Host(`localhost`) to the frontend. Production's entrypoint-level
#     HTTP->HTTPS redirect is intentionally absent: it is set via static
#     `command` flags, which this file replaces wholesale, and there is no
#     :443 here to redirect to
#   - frontend/backend/worker/migrate run locally built images
#     (openmentor-frontend:dev-<sha> / openmentor-backend:dev-<sha>, built and
#     tagged by ./deploy-dev.sh — same SHA-tag convergence model as prod)
#   - postgres uses dev credentials, a disposable non-external volume and
#     publishes host port 5433 for local tooling
#   - app ports (3000/8081/8090) are additionally published directly for
#     debugging; in production only traefik is exposed
#   - alloy and cadvisor are OPT-IN behind the `observability` profile:
#     alloy cannot start without Grafana Cloud credentials AND the
#     ./alloy-secrets/postgres_secret_openmentor file (its local.file
#     component fails hard on a missing file), so it must not be part of the
#     default dev stack. Enable with:
#       docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#         --profile observability up -d
#   - postgres-backup stays production-only (dev data is disposable and the
#     local stack must never touch backup buckets)
#
# Usage: ./deploy-dev.sh [targets...]   (recommended — builds images, sets
#        FRONTEND_IMAGE_TAG/BACKEND_IMAGE_TAG in .env, converges, healthchecks)
# Raw:   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#        (requires images already built/tagged AND .env present, e.g. from a
#        previous ./deploy-dev.sh run; after editing .env just re-run `up -d`,
#        which re-reads it — containers get explicit per-service `environment:`
#        allowlists, no shared env file)

services:
  # Traefik in HTTP-only mode: no Let's Encrypt / Cloudflare DNS-01, single
  # :80 entrypoint, and no HTTP->HTTPS redirect.
  #
  # HOW the redirect is dropped changed with the v3 upgrade, and it matters:
  # production now redirects at the ENTRYPOINT (static `command` flags), not
  # via a catch-all router's labels. Compose REPLACES `command` wholesale
  # rather than appending to it, so the list below is the complete argv and
  # the production redirect/ACME/websecure flags simply never reach dev.
  #
  # The trap that follows: adding a flag to the base file's `command` does
  # NOT reach dev. Anything production needs at the entrypoint level has to
  # be added in BOTH places, or deliberately left out here — as the redirect
  # is, since dev publishes no :443 for it to redirect to.
  traefik:
    # NOTE: this replaces the base command wholesale, so every flag we still
    # want has to be repeated here — including the project constraint.
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Without this, a getmentor.dev stack running on the same Docker daemon
      # (they can now run side by side) also publishes a router called
      # "frontend", and Traefik drops the duplicate — http://localhost/ starts
      # 404ing while :3000 still works. See the base file for the full note.
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`openmentor`)"
      - "--entrypoints.web.address=:80"
    ports: !override
      - "127.0.0.1:80:80"
    environment: !override []
    # Base no longer puts routing labels on this container (the dead
    # `http-catchall` set is gone). Kept as a guard: traefik's own container
    # must stay label-free in dev, or any future base label referencing
    # `websecure`/`letsencrypt` would spam errors against a stack that has
    # neither.
    labels: !override []

  frontend:
    # Locally built image (tagged by ./deploy-dev.sh); same runner target as
    # production so convergence behaves identically.
    image: openmentor-frontend:${FRONTEND_IMAGE_TAG:-dev}
    environment:
      - APP_ENV=development
      - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-development}
    # Publish directly for debugging alongside the traefik route
    ports:
      - "127.0.0.1:3000:3000"
    # HTTP-only localhost routing (base labels reference the websecure
    # entrypoint and the letsencrypt resolver, which don't exist in dev).
    #
    # Production dropped its plaintext `web` router in the v3 upgrade because
    # the entrypoint redirect makes one unreachable. Dev keeps this one on
    # purpose: with no redirect and no :443, it is the ONLY way in. So the
    # router name differs from production's (`frontend` here vs
    # `frontend-secure` there) — that is intended, not drift.
    #
    # Deliberately NOT mirrored from production: the `sec-headers` and
    # `edge-ratelimit` middlewares. sec-headers sets HSTS, and an HSTS header
    # on localhost pins the browser to https://localhost for a year — with no
    # :443 published that bricks local dev in a way a rebuild does not fix
    # (it needs clearing by hand in chrome://net-internals/#hsts). Rate
    # limiting is likewise noise against a single local user.
    #
    # `Host()` is valid in both v2 and v3 rule syntax, so these labels needed
    # no migration — unlike the base file's old `hostregexp({host:.+})`.
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`) || Host(`www.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  # PostgreSQL database for development.
  # Overrides the base `postgres` service (same image/limits) with dev
  # credentials, a regular non-external dev volume (the mount below replaces
  # the base `postgres-data` mount — same container path wins on merge) and
  # host port 5433 for local tooling. Only ONE database runs in the merged
  # stack.
  postgres:
    container_name: openmentor-postgres-dev
    environment:
      - POSTGRES_USER=openmentor
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=openmentor
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      # Host port for local tooling; override with POSTGRES_DEV_PORT in .env
      # if 5433 is taken on your machine
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmentor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # migrate/backend/worker share the locally built backend image. The base
  # dependency ordering is kept untouched: migrate waits for postgres to be
  # healthy, backend and worker wait for migrate to complete successfully.
  migrate:
    image: openmentor-backend:${BACKEND_IMAGE_TAG:-dev}
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://openmentor:password@postgres:5432/openmentor?sslmode=disable

  backend:
    image: openmentor-backend:${BACKEND_IMAGE_TAG:-dev}
    # Publish directly for debugging (in prod the API is internal-only)
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - GIN_MODE=debug
      - APP_ENV=development
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://openmentor:password@postgres:5432/openmentor?sslmode=disable

  worker:
    image: openmentor-backend:${BACKEND_IMAGE_TAG:-dev}
    # Publish directly for debugging (manual job/cron triggers)
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - GIN_MODE=debug
      - APP_ENV=development
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://openmentor:password@postgres:5432/openmentor?sslmode=disable

  # Disable the backup sidecar in development - dev data is disposable and
  # the local stack should not touch backup buckets
  postgres-backup:
    profiles:
      - production-only

  # Observability is OPT-IN in dev (`--profile observability`): running alloy
  # without real Grafana Cloud credentials would only spam push errors, and it
  # fails to start at all without ./alloy-secrets/postgres_secret_openmentor
  # (see header comment). cadvisor is only useful when alloy scrapes it.
  alloy:
    profiles:
      - observability

  cadvisor:
    profiles:
      - observability

volumes:
  pgdata:
    name: openmentor-postgres-data-dev
