name: Checks

# THE merge gate, and the only check that should be marked required.
#
# "CI / Web" and "CI / API" are path-filtered, so their job names can never be
# required: a docs-only PR would wait forever for checks that never start.
# This workflow runs on every pull request and exposes one stable check —
# "required-checks".
#
# It owns every FAST check, and owns them exclusively — the deep workflows do
# not repeat them. Before this split, a web PR ran lint/type-check/tests twice
# (identical commands here and in "CI / Web"), and `go vet` ran three times on
# an api PR (here, in "CI / API -> Run Tests", and again inside golangci-lint).
#
#   web changed        -> lint + type check + tests
#   api changed        -> golangci-lint + tests
#   infra changed      -> compose renders + per-service env allowlist + shellcheck
#                         + infra tests
#   migrations changed -> version numbering (duplicates, gaps, merge order),
#                         then up / down / up again against an ephemeral Postgres
#   scripts changed    -> shellcheck (every *.sh outside infra/)
#   runbooks changed   -> the operator diagnostics tests
#   .github/ changed   -> actionlint + dispatch-input scan
#   none of the above  -> passes trivially
#
# Every group is a STEP of the single required-checks job, never a job of its
# own: a second required job name deadlocks every PR whose paths do not match
# it, which is the same trap as requiring "CI / Web".
#
# ci-web.yml / ci-api.yml keep only what this cannot cheaply do: the production
# build, the race detector + coverage floor, the gosec SARIF upload for the
# Security tab, and the Docker smoke test.
#
# The runbooks group lives ONLY here, and it starts its own throwaway Postgres in
# the step rather than as a job-level `services:` block — a service would boot a
# database on every PR, including the ones that touch neither runbook.
#
# Also runs on pushes to main. `strict_required_status_checks_policy` is off in
# the ruleset, so a PR can merge against a stale base — post-merge verification
# is what catches the resulting skew. On push every group runs regardless of
# paths: main should always be verified end to end.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SECURITY (L6): least-privilege default token for this workflow.
permissions:
  contents: read

jobs:
  required-checks:
    name: required-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci-web.yml'
              - '.github/workflows/checks.yml'
            api:
              - 'api/**'
              - '.github/workflows/ci-api.yml'
              - '.github/workflows/checks.yml'
            infra:
              - 'infra/**'
              # `make check` also asserts the backup alert, its dashboard panels,
              # the Alloy labels and the sidecar gauges stay consistent
              # (alert-consistency-test.sh), so a change to either Grafana file
              # has to run it
              - 'grafana/alerting/**'
              - 'grafana/dashboards/**'
              # `make check` also applies every migration to a throwaway database
              # and asserts the per-service Postgres roles stay least-privilege
              # (db-identity-test.sh), so a new migration has to run it — a stray
              # GRANT is how H8 comes back silently.
              - 'api/migrations/**'
              # `make check` also asserts the four Postgres advisory-lock
              # namespaces do not collide (advisory-lock-namespace-test.sh, D82).
              # Three of the four keys live in api/, so editing one there has to
              # run the infra gate — a collision produces no error anywhere, just
              # two unrelated components excluding each other.
              - 'api/internal/repository/slug_history_repository.go'
              - 'api/internal/worker/repository.go'
              - 'api/test/dbtest/dbtest.go'
              - '.github/workflows/checks.yml'
            workflows:
              - '.github/workflows/**'
            runbooks:
              - 'docs/runbooks/audit-2026-08/**'
              # diagnostics_test.sh also asserts that the remediation plan's own
              # operator instructions match the runbooks, so a plan-only edit has
              # to run the gate too.
              - 'docs/audit/2026-08-remediation-plan.md'
              - 'api/migrations/**'
              - '.github/workflows/checks.yml'
            # Scripts outside infra/ (infra's own are covered by `make check`).
            # Deliberately as wide as the step's `git ls-files '*.sh'`
            # enumeration: a narrower list left a script added outside it
            # ungated until the next push to main. The cost of the overlap is
            # that an infra-only change re-runs the step over an unchanged file
            # list, which is seconds.
            scripts:
              - '**/*.sh'
              - '.github/workflows/checks.yml'
            # The up/down harness is expensive enough (a Postgres container plus
            # a golang-migrate build) to earn its own narrow filter instead of
            # riding on every api/ change.
            migrations:
              - 'api/migrations/**'
              - 'api/scripts/migration-test.sh'
              - 'api/scripts/migration-version-check.sh'
              - 'api/Makefile'
              - '.github/workflows/checks.yml'

      # --- Workflow quick gate ---------------------------------------------

      # actionlint flags untrusted `${{ }}` values used in `run:` scripts (the
      # P5 script-injection class), expression/context errors YAML parsing
      # cannot see, and shellcheck findings in every `run:` block (shellcheck
      # is preinstalled on the runner). Pinned release + sha256 instead of a
      # third-party action: nothing unvetted belongs in the job that lints
      # workflows.
      - name: 'Workflows: actionlint'
        if: steps.filter.outputs.workflows == 'true' || github.event_name == 'push'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          bindir="$(mktemp -d)"
          curl -fsSL -o "$bindir/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "$ACTIONLINT_SHA256  $bindir/$tarball" | sha256sum -c -
          tar -xzf "$bindir/$tarball" -C "$bindir" actionlint
          "$bindir/actionlint" -color

      # actionlint's untrusted-input rule does NOT cover workflow_dispatch
      # inputs (v1.7.12 stays silent on `${{ inputs.x }}` inside a run script),
      # and that is the exact P5 vector, so gate it here. Only `run:` scripts
      # are scanned, which leaves the safe `env:`/`with:`/`if:` uses alone. The
      # leading class stops `needs.validate-inputs.*` from matching.
      - name: 'Workflows: no dispatch input inside a run script'
        if: steps.filter.outputs.workflows == 'true' || github.event_name == 'push'
        run: |
          rc=0
          for f in .github/workflows/*.yml; do
            scripts=$(yq '.jobs[] | .steps[]? | select(has("run")) | .run' "$f")
            if echo "$scripts" \
              | grep -nE '\$\{\{(.*[^A-Za-z0-9_.-])?(github\.event\.)?inputs\.'; then
              echo "::error file=$f::Interpolates a workflow_dispatch input into a run script (script injection). Pass it through env: and validate it instead."
              rc=1
            fi
          done
          exit "$rc"

      # --- Web quick gates -------------------------------------------------

      - name: Setup Node.js
        if: steps.filter.outputs.web == 'true' || github.event_name == 'push'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.x
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 'Web: install dependencies'
        if: steps.filter.outputs.web == 'true' || github.event_name == 'push'
        working-directory: web
        run: make install

      - name: 'Web: lint'
        if: steps.filter.outputs.web == 'true' || github.event_name == 'push'
        working-directory: web
        run: make lint

      - name: 'Web: type check'
        if: steps.filter.outputs.web == 'true' || github.event_name == 'push'
        working-directory: web
        run: make typecheck

      - name: 'Web: tests'
        if: steps.filter.outputs.web == 'true' || github.event_name == 'push'
        working-directory: web
        run: make test

      # --- API quick gates -------------------------------------------------

      - name: Set up Go
        if: steps.filter.outputs.api == 'true' || github.event_name == 'push'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum

      - name: 'API: install pinned golangci-lint'
        if: steps.filter.outputs.api == 'true' || github.event_name == 'push'
        working-directory: api
        run: |
          version=$(grep -oE '^GOLANGCI_VERSION := \S+' Makefile | cut -d' ' -f3)
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$version"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Replaces the old bare `go vet`: golangci-lint runs govet (enable-all)
      # plus staticcheck/errcheck/gofmt and the rest of api/.golangci.yml, so a
      # separate vet step would just be a slower subset.
      - name: 'API: lint'
        if: steps.filter.outputs.api == 'true' || github.event_name == 'push'
        working-directory: api
        run: make lint

      # Plain tests here (fast gate); the race detector + coverage floor run in
      # "CI / API -> Run Tests" where the extra minutes don't block every PR.
      - name: 'API: tests'
        if: steps.filter.outputs.api == 'true' || github.event_name == 'push'
        working-directory: api
        run: go test -timeout=5m ./...

      # --- Infra quick gates -----------------------------------------------

      # SECURITY (P10): this is what stops `- DATABASE_URL=${DATABASE_URL}`
      # reappearing on the internet-facing frontend in a PR that touches only
      # infra/. `make check` = compose renders (prod + dev) + the per-service
      # env allowlist and secret-ownership check + the backup sidecar tests.
      # Key names only, never values, so it is safe on a production-shaped env.
      # Runner already has docker compose and jq; nothing else to install.
      # `make check` includes `make shellcheck` over infra/'s own scripts (H12),
      # which is why the step below deliberately skips infra/ — one script, one
      # linter run.
      - name: 'Infra: checks'
        if: steps.filter.outputs.infra == 'true' || github.event_name == 'push'
        working-directory: infra
        run: make check

      # --- Shell scripts outside infra/ ------------------------------------

      # Every tracked *.sh that `make check` does not already cover: the runbook
      # scripts an operator runs against the LIVE database, api/scripts, and
      # web's build helper. The file list and the severity live in the script,
      # which infra/Makefile's shellcheck target also calls (with the other
      # scope) — same rule as every other gate here: CI runs the checked-in
      # command, never its own copy of it. `run:` blocks in the workflows
      # themselves are shellchecked by actionlint above.
      - name: 'Scripts: shellcheck'
        if: steps.filter.outputs.scripts == 'true' || steps.filter.outputs.runbooks == 'true' || github.event_name == 'push'
        run: ./scripts/shellcheck-all.sh outside-infra

      # --- Migration numbering ---------------------------------------------

      # The class git merges CLEANLY and silently: two branches that both add
      # `000010_*.sql` are different files, so there is no conflict — the merged
      # tree just has two migrations claiming one version, of which golang-migrate
      # applies one. Worse, `Up()` only walks FORWARD from the recorded version,
      # so a migration that merges in BELOW production's current version is never
      # applied there while every fresh database gets it — a divergence nothing
      # notices until a query hits the missing column.
      #
      # Needs no database, so it runs before the up/down harness and gives its
      # verdict in a second. The `origin/main` fetch is what the "is this new
      # migration above main's newest?" comparison reads; actions/checkout only
      # brings the PR's merge commit.
      - name: 'API: migration version numbering'
        if: steps.filter.outputs.migrations == 'true' || github.event_name == 'push'
        working-directory: api
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          make migration-check

      # --- Migration up/down apply -----------------------------------------

      # H12: the one property nothing else checks — that the .down.sql files run
      # and reverse their .up.sql. The Docker smoke test in "CI / API" only ever
      # migrates UP on an empty database, so this is not a duplicate of it.
      # Tolerates 000002_populate_tags having no down file yet (it walks down only
      # to that boundary and says so); the sibling H10 branch adds the file, after
      # which the same harness covers the full range automatically.
      - name: 'API: migrations apply up, down and up again'
        if: steps.filter.outputs.migrations == 'true' || github.event_name == 'push'
        working-directory: api
        run: make migration-test

      # --- Operator runbook gates ------------------------------------------
      #
      # docs/runbooks/audit-2026-08 holds scripts an operator runs against the
      # LIVE database, so they get the same treatment as code: shellcheck (above,
      # with every other script), plus tests that pin the safety properties
      # (report file mode, no personal data on the console, no ambiguous
      # connection, one consistent snapshot).

      - name: 'Runbooks: diagnostics tests'
        if: steps.filter.outputs.runbooks == 'true' || github.event_name == 'push'
        run: |
          set -euo pipefail

          # The database tier of the test SKIPS itself when psql is missing, and a
          # silent skip is worse than a red build — assert the client is here.
          command -v psql >/dev/null || { echo "psql is required for the runbook DB tier"; exit 1; }
          psql --version

          # Throwaway Postgres. The password is an ephemeral fixture, not a
          # secret: the container is created and destroyed inside this job and
          # publishes only to localhost.
          docker run -d --name pg-diagtest -p 55444:5432 \
            -e POSTGRES_USER=openmentor -e POSTGRES_PASSWORD=diagtest \
            -e POSTGRES_DB=openmentor postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg-diagtest pg_isready -h 127.0.0.1 -U openmentor -d openmentor && break
            [ "$i" = 30 ] && { echo "postgres never became ready"; docker logs pg-diagtest; exit 1; }
            sleep 1
          done

          PGHOST=127.0.0.1 PGPORT=55444 PGUSER=openmentor PGPASSWORD=diagtest \
          PGDATABASE=openmentor OM_DIAG_TEST_DB=1 \
            docs/runbooks/audit-2026-08/diagnostics_test.sh

      - name: 'Runbooks: remove the scratch database'
        if: always() && (steps.filter.outputs.runbooks == 'true' || github.event_name == 'push')
        run: docker rm -f pg-diagtest || true

      - name: No gated changes
        if: github.event_name == 'pull_request' && steps.filter.outputs.web != 'true' && steps.filter.outputs.api != 'true' && steps.filter.outputs.infra != 'true' && steps.filter.outputs.runbooks != 'true' && steps.filter.outputs.workflows != 'true' && steps.filter.outputs.scripts != 'true' && steps.filter.outputs.migrations != 'true'
        run: echo "No web/, api/, infra/, runbook, script or .github/workflows/ changes detected — nothing to gate."
