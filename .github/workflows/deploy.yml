name: Deploy

# Monorepo deploy: both images build from local subdirectories (web/ and
# api/), and the infra/ subdirectory is synced to the VM in place of the old
# separate infrastructure repository.

on:
  # Deploys are manual for now. If/when auto-deploy is wanted, add:
  # push:
  #   branches: [main]
  #   paths: ['web/**', 'api/**', 'infra/**']
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - both
          - frontend
          - backend
        default: 'both'
      image_tag:
        description: 'Image tag, Docker charset only (leave empty for commit SHA)'
        required: false
        type: string

# OIDC: the build jobs assume the AWS_CI_ROLE_ARN role via GitHub's OIDC
# provider (aws-actions/configure-aws-credentials) — no long-lived AWS keys
# in this repo's secrets. id-token: write is required for that token.
permissions:
  id-token: write
  contents: read

env:
  # AWS ECR (D19): registry host (<account-id>.dkr.ecr.<region>.amazonaws.com)
  # comes from the ECR_REGISTRY secret, set by the private provisioning
  # repo's set-github-secrets.sh alongside AWS_REGION and AWS_CI_ROLE_ARN.
  REGISTRY: ${{ secrets.ECR_REGISTRY }}
  FRONTEND_IMAGE: openmentor-frontend
  BACKEND_IMAGE: openmentor-backend
  DOMAIN: ${{ secrets.DOMAIN }}

jobs:
  # Preflight: everything checkable without touching production, so a
  # misconfigured deploy dies before the first credential, push or VM change.
  # The vetted tag reaches every other job through this job's output.
  validate-inputs:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
    steps:
      # SECURITY (L6/P5): image_tag is free text and reaches three shells (this
      # runner, the VM via ssh, and a `sed s|^KEY=.*|KEY=$TAG|` in the VM's
      # .env), so it arrives via env and must match Docker's tag grammar, which
      # admits no shell metacharacter and no `|`.
      - name: Resolve and validate image tag
        id: tag
        env:
          IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag }}
        run: |
          TAG="${IMAGE_TAG_INPUT:-$GITHUB_SHA}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo '::error::Rejected image_tag: must match ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ (Docker tag charset).'
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      # A deploy converges production step by step, so a secret needed only by
      # the LAST step (DOMAIN, for the public probe) still has to be checked
      # here — otherwise the VM is already changed when it turns out to be
      # missing. Names only: never echo a secret value.
      - name: Check required secrets
        env:
          # DOMAIN comes from the workflow-level env block above.
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_CI_ROLE_ARN: ${{ secrets.AWS_CI_ROLE_ARN }}
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          missing=()
          for name in DOMAIN ECR_REGISTRY AWS_REGION AWS_CI_ROLE_ARN \
                      VM_SSH_HOST VM_SSH_USER VM_SSH_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}. Nothing has been deployed."
            exit 1
          fi
          echo "All required secrets are set."

  # Build and push frontend
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    if: github.event.inputs.service == 'frontend' || github.event.inputs.service == 'both'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.validate-inputs.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GO_API_URL=http://backend:8081
            NEXT_PUBLIC_S3_STORAGE_ENDPOINT=${{ secrets.NEXT_PUBLIC_S3_STORAGE_ENDPOINT }}
            NEXT_PUBLIC_S3_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_S3_STORAGE_BUCKET }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_CDN_ENDPOINT=${{ secrets.NEXT_PUBLIC_CDN_ENDPOINT }}

      - name: Image build summary
        env:
          TAG: ${{ needs.validate-inputs.outputs.tag }}
        run: |
          echo "✅ Frontend image built and pushed successfully!"
          echo "Image: $REGISTRY/$FRONTEND_IMAGE:$TAG"

  # Build and push backend
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    if: github.event.inputs.service == 'backend' || github.event.inputs.service == 'both'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.validate-inputs.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image build summary
        env:
          TAG: ${{ needs.validate-inputs.outputs.tag }}
        run: |
          echo "✅ Backend image built and pushed successfully!"
          echo "Image: $REGISTRY/$BACKEND_IMAGE:$TAG"

  # Deploy to production VM
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate-inputs, build-frontend, build-backend]
    # A single-service deploy leaves the OTHER build 'skipped', so success()
    # can't be used here. Requiring "at least one success AND neither failed"
    # is what keeps a failed build's never-pushed tag out of the VM's .env,
    # where the next deploy's `cp .env .env.backup` would make it the rollback
    # target.
    if: >-
      !cancelled()
      && needs.validate-inputs.result == 'success'
      && needs.build-frontend.result != 'failure'
      && needs.build-backend.result != 'failure'
      && (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success')
    environment:
      name: production
      url: https://${{ env.DOMAIN }}
    # SECURITY (L6/P5): every value a `run:` shell needs comes from env, so no
    # ${{ }} is ever interpolated into a shell word in this job.
    env:
      SERVICE: ${{ github.event.inputs.service }}
      TAG: ${{ needs.validate-inputs.outputs.tag }}
      VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
      VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The VM used to `git pull` a separate infrastructure repo in
      # /opt/openmentor/infra. In the monorepo the compose files live in
      # infra/, so sync that subdirectory instead (same semantics as the
      # `infra` target of infra/deploy.sh). No --delete: runtime state
      # (.env, logs, backups, alloy-secrets) living next to the compose files
      # must survive. --checksum --itemize-changes reports WHICH files
      # changed so the deploy step can restart/rebuild services whose config
      # reaches the container through a bind mount (compose won't notice
      # those): alloy <- alloy/config.alloy (restart), postgres-backup is
      # built on the VM from postgres-backup/ (rebuild).
      - name: Sync infra/ to VM
        id: sync
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_HOST_KEY: ${{ secrets.VM_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # SECURITY (H2): prefer a pinned host key over trust-on-first-use.
          # Set the VM_SSH_HOST_KEY secret to the VM's public host key
          # (`ssh-keyscan -H <host>` output, run once from a trusted network)
          # so an ephemeral runner can't be MITM'd on first contact. Falls back
          # to keyscan with a warning until the secret is populated.
          if [ -n "$VM_SSH_HOST_KEY" ]; then
            printf '%s\n' "$VM_SSH_HOST_KEY" >> ~/.ssh/known_hosts
          else
            echo "::warning::VM_SSH_HOST_KEY not set - falling back to ssh-keyscan (trust-on-first-use). Pin the host key to remove MITM risk."
            ssh-keyscan -p 22 -H "$VM_SSH_HOST" >> ~/.ssh/known_hosts
          fi

          rsync -az --checksum --itemize-changes \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'logs/' \
            --exclude 'alloy-secrets/' \
            -e "ssh -i ~/.ssh/deploy_key -p 22" \
            infra/ \
            "$VM_SSH_USER@$VM_SSH_HOST:/opt/openmentor/infra/" \
            | tee rsync.log

          CHANGED_FILES=$(awk '$1 ~ /^[<>]f/ {print $2}' rsync.log)
          RESTART_ALLOY=0
          REBUILD_BACKUP=0
          if echo "$CHANGED_FILES" | grep -qx 'alloy/config.alloy'; then RESTART_ALLOY=1; fi
          if echo "$CHANGED_FILES" | grep -q '^postgres-backup/'; then REBUILD_BACKUP=1; fi
          echo "restart_alloy=$RESTART_ALLOY" >> "$GITHUB_OUTPUT"
          echo "rebuild_backup=$REBUILD_BACKUP" >> "$GITHUB_OUTPUT"
          echo "Bind-mount changes: restart_alloy=$RESTART_ALLOY rebuild_backup=$REBUILD_BACKUP"

      # CI-specific .env preparation: deploy.sh uploads a fresh .env with the
      # tag lines already resolved; the workflow instead edits the tag lines
      # of the VM's existing .env in place. Only the deployed service's tag
      # is updated (FRONTEND_IMAGE_TAG / BACKEND_IMAGE_TAG, matching
      # infra/deploy.sh); the other keeps its currently deployed tag. The
      # previous .env is preserved as .env.backup FIRST so deploy-remote.sh's
      # auto-rollback can restore the previous tags. Uses the SSH key written
      # by the sync step.
      - name: Set image tags on VM
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 \
            "$VM_SSH_USER@$VM_SSH_HOST" \
            "bash -s -- $(printf '%q ' "$SERVICE" "$TAG")" <<'TAG_SCRIPT'
          set -e
          SERVICE="$1"
          TAG="$2"
          cd /opt/openmentor/infra

          # Backup the current .env (previous image tags) for rollback
          if [ -f .env ]; then cp .env .env.backup; else touch .env; fi

          # Replace-or-append a KEY=value in .env
          set_env_tag() {
            if grep -q "^${1}=" .env; then
              sed -i "s|^${1}=.*|${1}=${2}|" .env
            else
              echo "${1}=${2}" >> .env
            fi
          }

          if [ "$SERVICE" = "frontend" ] || [ "$SERVICE" = "both" ]; then
            set_env_tag FRONTEND_IMAGE_TAG "$TAG"
          fi
          if [ "$SERVICE" = "backend" ] || [ "$SERVICE" = "both" ]; then
            set_env_tag BACKEND_IMAGE_TAG "$TAG"
          fi
          TAG_SCRIPT

      - name: Configure AWS credentials (mint ECR token for the VM)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Log the VM's docker into ECR from the runner: the short-lived token
      # (OIDC role) is piped over ssh stdin — it never appears in arguments,
      # env files, or on the VM's disk, and the VM holds no AWS credentials
      # and needs no aws CLI. Same mechanism as infra/deploy.sh.
      - name: Log the VM into ECR
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | ssh -i ~/.ssh/deploy_key -p 22 \
                "$VM_SSH_USER@$VM_SSH_HOST" \
                "docker login --username AWS --password-stdin '$REGISTRY'"

      # The remote deploy logic (volume, sidecar rebuild, pull, converge,
      # network-attachment guard, alloy restart, health checks, auto-rollback)
      # lives in infra/deploy-remote.sh — the single canonical script shared
      # with infra/deploy.sh. The runner pipes its CHECKED-OUT copy over ssh
      # stdin, so the executed logic always matches this commit regardless of
      # what the rsync step shipped. The workflow always syncs infra/, hence
      # always --remove-orphans (same as deploy.sh's infra target).
      #
      # Exit codes (header of infra/deploy-remote.sh): 1 = the deploy failed and
      # was auto-rolled-back; 2 = the deploy CONVERGED and every app health check
      # passed, but the postgres-backup sidecar reports UNHEALTHY (stale nightly
      # dumps). 2 fails this step on purpose — it is the only off-VM signal until
      # DatabaseBackupStale is applied to Grafana — while the running code is
      # fine and nothing was reverted. Don't "fix" a red run by dropping the
      # check; fix the backups.
      - name: Deploy on VM
        env:
          RESTART_ALLOY: ${{ steps.sync.outputs.restart_alloy }}
          REBUILD_BACKUP: ${{ steps.sync.outputs.rebuild_backup }}
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 \
            "$VM_SSH_USER@$VM_SSH_HOST" \
            "bash -s -- $(printf '%q ' "--remove-orphans" "$RESTART_ALLOY" "$REBUILD_BACKUP")" \
            < infra/deploy-remote.sh

      # Mandatory and fatal: deploy-remote.sh only probes container loopback, so
      # a broken cert, router or middleware still looks healthy to it. DOMAIN is
      # guaranteed non-empty by the preflight job.
      - name: Verify public endpoint
        run: |
          URL="https://$DOMAIN/api/healthcheck"
          # ~2 min budget: the frontend container has a 40s start_period, and
          # Traefik needs a moment to pick up the recreated container (longer
          # if the certificate is being issued or renewed).
          ATTEMPTS=12
          DELAY=10
          HTTP_STATUS=000
          CURL_EXIT=0

          for attempt in $(seq 1 "$ATTEMPTS"); do
            CURL_EXIT=0
            # -sS keeps curl's own diagnosis (bad certificate, DNS failure) on
            # stderr; %{http_code} is 000 when the request never completed.
            HTTP_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL") || CURL_EXIT=$?
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ $URL returned HTTP 200 on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt/$ATTEMPTS: HTTP $HTTP_STATUS (curl exit $CURL_EXIT)"
            if [ "$attempt" -lt "$ATTEMPTS" ]; then sleep "$DELAY"; fi
          done

          echo "::error::$URL never returned HTTP 200 (last: HTTP $HTTP_STATUS, curl exit $CURL_EXIT). The containers passed their loopback health checks, so suspect DNS, the Let's Encrypt certificate, or Traefik routing/middleware. The site is very likely down - roll back."
          exit 1

      - name: Deployment summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Deployment Summary 🚀"
            echo ""
            echo "**Status**: $JOB_STATUS"
            echo "**Image Tag**: \`$TAG\`"
            echo "**Commit**: $COMMIT"
            echo "**Triggered by**: $ACTOR"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$JOB_STATUS" = "success" ]; then
            {
              echo "✅ Deployment completed successfully - https://$DOMAIN/api/healthcheck returned HTTP 200 through Traefik."
              echo ""
              echo "**Next steps**:"
              echo "1. Verify application at https://$DOMAIN"
              echo "2. Monitor Grafana dashboards for anomalies"
              echo "3. Check error logs if needed"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ Deployment failed!"
              echo ""
              echo "**Troubleshooting**:"
              echo "1. Check workflow logs above"
              echo "2. SSH to VM and run: \`docker compose logs\`"
              echo "3. Consider rolling back: \`./rollback.sh <previous-sha>\` from a workstation, or on the VM: \`cp .env.backup .env && docker compose up -d\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # This job does NOT page anyone — it only annotates the run, which someone
  # has to go and look at.
  # TODO: add a SLACK_WEBHOOK_URL secret and POST to it here (or use
  # slackapi/slack-github-action); until then a failed production deploy is
  # silent unless a human is watching.
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Record deployment failure
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## 🚨 Deployment failed"
            echo ""
            echo "Run: $RUN_URL"
            echo ""
            echo "**No alert was sent.** This repository has no notification integration"
            echo "configured (see the TODO above \`notify-failure\` in"
            echo ".github/workflows/deploy.yml), so nobody was paged."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Deployment failed. No alerting integration is configured, so nobody was notified automatically."
