name: CI / Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'

  # Allows manual trigger from Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

# SECURITY (L6): least-privilege default token for this workflow.
permissions:
  contents: read

# Lint, type check and tests are NOT here: they live in checks.yml
# ("required-checks"), which runs them on every PR. Duplicating them here meant
# every web PR ran the identical make targets twice on two runners.

jobs:
  # Build the application
  build:
    name: Build
    runs-on: ubuntu-latest

    # Plain CI values, not secrets: every NEXT_PUBLIC_* var is public by
    # definition (baked into the client bundle), and literals keep the build
    # reproducible and working on fork PRs where secrets are unavailable.
    # Real values are injected by the deploy pipeline (deploy.yml).
    env:
      NEXT_PUBLIC_GO_API_URL: http://localhost:8081
      NEXT_PUBLIC_S3_STORAGE_ENDPOINT: s3.eu-central-1.amazonaws.com
      NEXT_PUBLIC_S3_STORAGE_BUCKET: mentor-images
      # Cloudflare's official always-pass Turnstile test site key
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_ANALYTICS_PROVIDER: none
      NEXT_PUBLIC_APP_ENV: development

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.x
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: make install

      - name: Build application
        run: make build

  # Docker image build + runtime smoke test.
  #
  # `build` above compiles the app with the runner's Node (setup-node above),
  # which is NOT the Node the image ships. Without this job nothing in CI ever
  # executed web/Dockerfile, so a base-image bump could only be validated by
  # deploying it. This catches: the pinned node:*-alpine tag existing, `npm ci`
  # resolving under it, native deps (sharp) having binaries for that ABI, the
  # standalone output copying correctly, and the server actually booting and
  # serving on that Node major.
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same public literals as the build job: NEXT_PUBLIC_* is baked into the
      # client bundle, so nothing here is a secret and fork PRs still work.
      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          load: true
          tags: openmentor-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GO_API_URL=http://localhost:8081
            NEXT_PUBLIC_S3_STORAGE_ENDPOINT=s3.eu-central-1.amazonaws.com
            NEXT_PUBLIC_S3_STORAGE_BUCKET=mentor-images
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
            NEXT_PUBLIC_ANALYTICS_PROVIDER=none
            NEXT_PUBLIC_APP_ENV=development

      - name: Verify image runs on its own Node
        run: |
          set -euo pipefail
          IMAGE=openmentor-web:${{ github.sha }}

          # Assert the shipped Node satisfies package.json "engines.node".
          # A Dockerfile base bump that outruns the declared engine range is
          # exactly the drift this job exists to catch.
          #
          # engines.node is read on the runner with jq rather than mounted into
          # the container: this step inherits `working-directory: web`, so a
          # $PWD-relative mount path is a foot-gun, and a missing bind-mount
          # source silently becomes an empty directory instead of an error.
          IMAGE_NODE=$(docker run --rm --entrypoint node "$IMAGE" -p 'process.versions.node')
          WANT=$(jq -r '.engines.node // empty' package.json)
          echo "image node: $IMAGE_NODE / engines.node: ${WANT:-<unset>}"

          if [ -z "$WANT" ]; then
            echo "no engines.node declared, skipping"
            exit 0
          fi

          CLAUSES=$(printf '%s' "$WANT" | tr '|' ' ')

          # Matched with shell loops rather than `... | grep -q`: under
          # `pipefail` a grep that exits early can leave the upstream stage
          # killed by SIGPIPE, and the pipeline reports 141 even on a match.
          #
          # Only assert on the simple "26.x" / "26 || 28" forms this repo uses.
          # Anything richer (ranges, carets) needs a real semver parser, so skip
          # rather than fail on a shape we cannot read.
          for c in $CLAUSES; do
            case "${c%.x}" in
              '' | *[!0-9]*)
                echo "engines.node \"$WANT\" is not a plain major list, skipping"
                exit 0
                ;;
            esac
          done

          for c in $CLAUSES; do
            if [ "${c%.x}" = "${IMAGE_NODE%%.*}" ]; then
              echo "node $IMAGE_NODE satisfies engines.node \"$WANT\""
              exit 0
            fi
          done

          echo "::error::image ships Node $IMAGE_NODE but web/package.json engines.node is \"$WANT\" — bump engines (and the CI node-version pins) together with the Dockerfile base image"
          exit 1

      - name: Smoke test image (boot + healthcheck)
        run: |
          set -euo pipefail
          IMAGE=openmentor-web:${{ github.sha }}

          # Every O11Y_* var has a default in tracing-server.ts, so the app boots
          # without them — but it would then spend the smoke test retrying OTLP
          # exports against alloy:4318, which does not exist here. Disabling the
          # SDK keeps the logs readable and the failure modes about the image.
          docker run -d --name web -p 3000:3000 \
            -e NEXT_PUBLIC_GO_API_URL=http://localhost:8081 \
            -e GO_API_INTERNAL_TOKEN=ci-internal-token \
            -e METRICS_AUTH_TOKEN=ci-metrics-token \
            -e OTEL_SDK_DISABLED=true \
            "$IMAGE"

          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/healthcheck >/dev/null && break
            [ "$i" = 30 ] && { echo "web never became healthy"; docker logs web; exit 1; }
            sleep 2
          done

          echo "--- healthcheck"
          curl -fsS http://localhost:3000/api/healthcheck

          echo "--- logs (for the record)"
          docker logs web

          docker rm -f web
