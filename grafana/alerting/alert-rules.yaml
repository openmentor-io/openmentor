# OpenMentor Grafana-managed alert rules — versioned source of record.
#
# APPLIED 2026-08-04 (all 14 rules, atomically, via the group PUT below) after
# the 2026-08-04 deploy outage paged nobody. If you edit this file, re-apply —
# nothing syncs it automatically.
#
# RE-APPLIED later the same day to a NEW folder: the first apply went to the
# manually-created "OpenMentor" folder (uid fd2fpl), and by ~15:45 UTC that
# folder and all 14 rules had been DELETED from the stack — most plausibly a
# human tidying what looked like a duplicate of the Git Sync "openmentor"
# dashboards folder (Git Sync runs in folder mode and does not manage other
# folders). The rules now live in "OpenMentor Alerts" (uid openmentor-alerts),
# named so it cannot be mistaken for the dashboards folder. Deleting a Grafana
# folder silently deletes every alert rule in it — check
# /api/v1/provisioning/alert-rules before assuming anything is still applied. The pre-apply ordering rule still holds for
# NEW noDataState:Alerting rules: verify the series exists (an instant query)
# before applying, or the rule pages the moment it is created — the live
# notification policy fans out to telegram/slack/Discord.
#
# ⚠️ PENDING RE-APPLY (audit H13, edited 2026-08-04 after the group was applied):
# ContainerHighCPU, ContainerHighMemory, DBErrorRate and DBLatencyP95 were
# rewritten because none of the first two could fire and the last two aggregated
# the API and the worker into one number. The versions LIVE on the stack are the
# old ones until an operator re-runs the group PUT below. Nothing about the new
# expressions pages on arrival — all four keep noDataState: OK and every
# threshold was checked against live data first (ContainerHighMemory's highest
# instance is ~37% against an 85% threshold).
#
# Target: folder "OpenMentor Alerts" (uid `openmentor-alerts`), rule group `openmentor`, org 1.
# NOT the Git Sync folder `repository-7b3d712` this file used to name:
# Grafana refuses alert rules in Git Sync-managed folders
# ("invalid alert rule: cannot store rules in folder managed by Git Sync"),
# so the dashboards' folder can never hold these rules.
#
# How to apply:
#   * Grafana provisioning API — PUT the whole group (atomic, matches this file):
#       PUT https://<stack>.grafana.net/api/v1/provisioning/folder/openmentor-alerts/rule-groups/openmentor
#     with an editor/admin service-account token and header
#     `X-Disable-Provenance: true` (keeps rules editable in the UI). Body: this
#     file's group converted to JSON ({title, folderUid, interval: 60, rules}).
#   * Or ask Claude/the Grafana MCP (`alerting_manage_rules`, or a raw
#     `grafana_api_request` PUT as above) to sync from this file.
#   * NOT the UI "Import alert rules" button — that importer takes
#     Prometheus/Mimir rule YAML (groups[].rules[].alert/expr) and rejects this
#     Grafana provisioning format with "missing or invalid groups array".
#   * This file also matches the file-provisioning format (`apiVersion: 1` /
#     `groups:`) used by self-hosted Grafana (`/etc/grafana/provisioning/alerting/`).
#
# Notifications: rules route through the DEFAULT notification policy. No contact
# points are provisioned here — see grafana/README.md for the manual Telegram/email
# contact-point setup step.
#
# Datasource UID: grafanacloud-prom (Prometheus/Mimir).

apiVersion: 1
groups:
  - orgId: 1
    name: openmentor
    folder: OpenMentor Alerts # uid openmentor-alerts — NOT the Git Sync dashboards folder (see header)
    interval: 1m
    rules:
      - uid: om-service-down
        title: ServiceDown
        condition: B
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical, team: openmentor }
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "Prometheus scrape target {{ $labels.job }} (instance {{ $labels.instance }}) has been down for more than 5 minutes. All OpenMentor services and the observability agent are covered by this rule."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafanacloud-prom
            model: { expr: "up", instant: true, refId: A }
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      - uid: om-high-error-rate
        title: HighErrorRate
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical, team: openmentor }
        annotations:
          summary: "{{ $labels.service_name }} 5xx error rate above 5%"
          description: "Service {{ $labels.service_name }} is returning {{ printf \"%.2f\" $values.A.Value }}% HTTP 5xx responses over the last 10 minutes (threshold 5%)."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: '100 * sum by (service_name) (rate(http_server_request_total{service_name=~"openmentor-.*", http_response_status_code=~"5.."}[10m])) / sum by (service_name) (rate(http_server_request_total{service_name=~"openmentor-.*"}[10m]))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [5] } }]

      - uid: om-high-latency-p99
        title: HighLatencyP99
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, team: openmentor }
        annotations:
          summary: "{{ $labels.service_name }} p99 latency above 2s"
          description: "Service {{ $labels.service_name }} p99 HTTP request duration is {{ printf \"%.2f\" $values.A.Value }}s over the last 10 minutes (threshold 2s)."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: 'histogram_quantile(0.99, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket{service_name=~"openmentor-.*"}[10m])))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [2] } }]

      # The two container rules below key on cAdvisor's `name` label. That label
      # IS exposed by this setup — verified against the live tenant 2026-08-04:
      # container_cpu_usage_seconds_total and container_memory_working_set_bytes
      # both carry name="openmentor-backend", "grafana-alloy", "traefik", … The
      # older claim that it was missing (grafana/README.md, audit H13) was wrong,
      # so NO cAdvisor mount or flag change is needed for these to work.
      #
      # noDataState: OK is correct for both, unlike the version of this file where
      # it merely hid a rule that never returned data: an empty result now means
      # the containers are not running, which ServiceDown pages for (up carries
      # job="prometheus.scrape.cadvisor", verified live). A container that has
      # legitimately stopped must not raise a *resource* warning.
      - uid: om-container-high-cpu
        title: ContainerHighCPU
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, team: openmentor }
        annotations:
          summary: "Container {{ $labels.name }} is using {{ printf \"%.0f\" $values.A.Value }}% of the VM's CPU"
          description: "Container {{ $labels.name }} has held {{ printf \"%.1f\" $values.A.Value }}% of the whole VM's CPU capacity for 15 minutes (threshold 75%). This is a share of ALL cores, not of one: no container in docker-compose.yml sets a CPU quota, so the VM's core count is the only real denominator. Check `docker stats` and the service's own latency/goroutine panels — a runaway loop and a genuine traffic spike look identical here."
        data:
          # 90% of ONE core was the old threshold, described as "CPU above 90%".
          # machine_cpu_cores is 4 on this VM (verified live 2026-08-04), so that
          # fired at 22.5% of the machine — and would drift silently on a resize.
          # Divide by it instead: `on (instance) group_left ()` matches the one
          # machine_cpu_cores series per cAdvisor, then max by (name) drops
          # instance/id/image so an alert instance survives a redeploy instead of
          # resolving and re-firing under a new container id.
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: '100 * max by (name) (sum by (instance, name) (rate(container_cpu_usage_seconds_total{name=~"openmentor-.*|grafana-alloy|traefik|cadvisor"}[5m])) / on (instance) group_left () machine_cpu_cores)'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [75] } }]

      - uid: om-container-high-memory
        title: ContainerHighMemory
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, team: openmentor }
        annotations:
          summary: "Container {{ $labels.name }} is at {{ printf \"%.0f\" $values.A.Value }}% of its memory limit"
          description: "Container {{ $labels.name }} has held {{ printf \"%.1f\" $values.A.Value }}% of its own docker-compose mem_limit for 15 minutes (threshold 85%). Working set, i.e. what the kernel OOM killer accounts — at 100% the container is killed and restarted with no other warning. Go services also carry a GOMEMLIMIT ~20% under mem_limit (docker-compose.yml), so a Go container sitting here is already GC-thrashing."
        data:
          # A RATIO of each container's own mem_limit, because a single absolute
          # threshold cannot work: the limits are 256m/512m/768m and the previous
          # threshold of 1073741824 (1GiB) was above the LARGEST of them, so the
          # kernel OOM-killed every container long before the rule could fire.
          # Verified live 2026-08-04: 6 series exist, 0 above 1GiB, ever.
          #
          # The divisors are mem_limit in bytes and are written out here rather
          # than read from container_spec_memory_limit_bytes, which would be the
          # obvious source: Grafana Cloud Adaptive Metrics has that metric
          # aggregated on this tenant and drops `name` from it, so
          # `... / on (name) group_left () container_spec_memory_limit_bytes`
          # errors out ("Can't query aggregated metric ... without aggregation").
          # Excluding it from aggregation is an operator action in Grafana Cloud,
          # and a rule that needs one to fire is exactly what H13 forbids.
          # infra/alert-fireability-test.sh therefore checks every divisor here
          # against the service's mem_limit in docker-compose.yml, and fails when
          # a container is missing, double-counted, or paired with a stale limit.
          #
          #   805306368 = 768m   536870912 = 512m   268435456 = 256m
          #
          # openmentor-migrate is deliberately absent: it is a one-shot that runs
          # to completion and exits, so a 15m window over it is meaningless.
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: '100 * max by (name) (container_memory_working_set_bytes{name="openmentor-frontend"} / 805306368 or container_memory_working_set_bytes{name=~"openmentor-backend|openmentor-postgres|grafana-alloy"} / 536870912 or container_memory_working_set_bytes{name=~"openmentor-worker|openmentor-postgres-backup|traefik|cadvisor"} / 268435456)'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [85] } }]

      - uid: om-goroutine-leak
        title: GoroutineLeak
        condition: B
        for: 15m
        # nodata-ok: process_runtime_go_goroutines is published continuously by
        # both Go services, so an empty result really does mean they stopped
        # being scraped — but ServiceDown already pages for that with
        # noDataState: Alerting on `up`, per job. Alerting here would only add a
        # second page for the same cause, and NoData on a service that is
        # intentionally stopped (a deploy recreating it) is not a leak.
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, team: openmentor }
        annotations:
          summary: "{{ $labels.service_name }} goroutine count above 1000"
          description: "Service {{ $labels.service_name }} has {{ printf \"%.0f\" $values.A.Value }} goroutines, which may indicate a goroutine leak (threshold 1000)."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: 'process_runtime_go_goroutines{service_name=~"openmentor-.*"}'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [1000] } }]

      - uid: om-contact-form-failures
        title: ContactFormFailures
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning, team: openmentor }
        annotations:
          summary: "Contact form submissions are failing"
          description: "{{ printf \"%.0f\" $values.A.Value }} contact form submissions failed (status != success) in the last 30 minutes. Check captcha configuration and API errors."
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: 'sum(increase(openmentor_contact_form_submissions_total{status!="success"}[30m]))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: om-review-submission-failures
        title: ReviewSubmissionFailures
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning, team: openmentor }
        annotations:
          summary: "Review submissions are failing"
          description: "{{ printf \"%.0f\" $values.A.Value }} review submissions failed (status != success) in the last 30 minutes. Check captcha and database connectivity."
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: 'sum(increase(openmentor_review_submissions_total{status!="success"}[30m]))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: om-email-send-failures
        title: EmailSendFailures
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning, team: openmentor }
        annotations:
          summary: "Worker email sends are failing"
          description: "{{ printf \"%.0f\" $values.A.Value }} emails failed to send (outcome=error) in the last 30 minutes. Check the email provider and worker logs."
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: 'sum(increase(openmentor_worker_email_sends_total{outcome="error"}[30m]))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: om-postgres-down
        title: PostgresDown
        condition: B
        for: 5m
        # pg_up ships continuously via database_observability (2026-07-18, see
        # docs/runbooks/database-observability.md), so a missing series is itself
        # a failure signal: NoData=Alerting pages when the exporter disappears.
        noDataState: Alerting
        execErrState: OK
        labels: { severity: critical, team: openmentor }
        annotations:
          summary: "PostgreSQL is down"
          description: "pg_up reports PostgreSQL as unreachable (or pg_* metrics disappeared entirely — NoData also alerts, since the db-o11y exporter ships them continuously when the database is healthy)."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafanacloud-prom
            model: { expr: "pg_up", instant: true, refId: A }
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      - uid: om-db-error-rate
        title: DBErrorRate
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning, team: openmentor }
        annotations:
          summary: "{{ $labels.service_name }} database operation error rate above 5%"
          description: "{{ printf \"%.2f\" $values.A.Value }}% of {{ $labels.service_name }}'s database client operations returned status=error over the last 10 minutes (threshold 5%)."
        data:
          # Grouped by service_name. Ungrouped, this summed the API and the worker
          # into one number, and the API does far more database work than the
          # worker at every hour of the day — so a worker whose every query was
          # failing stayed well under 5% of the combined denominator and never
          # paged. Live values 2026-08-04: service_name="openmentor-api" and
          # "openmentor-worker", both from db_client_operation_total.
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: '100 * sum by (service_name) (rate(db_client_operation_total{service_name=~"openmentor-.*", status="error"}[10m])) / sum by (service_name) (rate(db_client_operation_total{service_name=~"openmentor-.*"}[10m]))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [5] } }]

      - uid: om-db-latency-p95
        title: DBLatencyP95
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning, team: openmentor }
        annotations:
          summary: "{{ $labels.service_name }} database p95 latency above 0.5s"
          description: "{{ $labels.service_name }}'s 95th percentile database operation duration is {{ printf \"%.3f\" $values.A.Value }}s over the last 15 minutes (threshold 0.5s)."
        data:
          # Grouped by service_name, same reason as DBErrorRate: one p95 over both
          # services is a p95 of neither. The worker's batch queries are legitimately
          # slower than the API's request-path ones, so a merged histogram either
          # pages on healthy worker traffic or hides real API latency behind it.
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: 'histogram_quantile(0.95, sum by (le, service_name) (rate(db_client_operation_duration_seconds_bucket{service_name=~"openmentor-.*"}[15m])))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [0.5] } }]

      - uid: om-db-backup-stale
        title: DatabaseBackupStale
        condition: B
        for: 10m
        # NoData=Alerting, unlike most rules in this file: the postgres-backup
        # sidecar publishes these gauges continuously via Alloy's textfile
        # collector, so an EMPTY result means the sidecar, the metrics volume or
        # Alloy is gone — the silent-failure mode this rule exists to catch.
        #
        # It does NOT cover one deployment going silent while another keeps
        # publishing, which is a direct consequence of the `max by (deployment)`
        # below. noDataState is a property of the whole query result, not of
        # individual label values: with production's series expired and staging's
        # still arriving, `max by (deployment)` returns one row, so the rule is
        # Normal rather than NoData and production's instance simply stops
        # existing. Grafana then treats that as a missing series and resolves it
        # after missing_series_evals_to_resolve evaluations — so a production page
        # already firing would auto-RESOLVE the moment the pipeline died. That
        # setting therefore cannot close the gap; it only delays the resolve.
        # Confirmed on this tenant 2026-08-03 with the identical shape:
        # `(time() - max by (job) (up{job=~"integrations/db-o11y|job-that-vanished"}))
        #  - max by (job) (...)` returns exactly one row, for the surviving job.
        # om-db-backup-pipeline-absent below is what catches the vanished one.
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical, team: openmentor }
        annotations:
          summary: "Postgres backups on {{ $labels.deployment }} are past their configured freshness window"
          description: "Deployment {{ $labels.deployment }}: the newest successful nightly pg_dump is {{ printf \"%.1f\" (divf $values.A.Value 3600) }} hours PAST the window the sidecar enforces (BACKUP_MAX_AGE_HOURS, published as openmentor_db_backup_max_age_seconds; dumps run daily at BACKUP_TIME). The documented RPO of 24h is no longer met. If the sidecar has never produced a dump, the age counts from its first start instead. Check `docker logs openmentor-postgres-backup` for a FAILURE line and follow docs/runbooks/postgres-backup-restore.md."
        data:
          # One alert instance per deployment, and the threshold is the sidecar's
          # own configured window rather than a copy of it:
          #
          #   • `max by (deployment)`, not a global `max()`. `./deploy.sh
          #     --staging` uploads the same .env.production, so a staging VM
          #     remote-writes these gauges to this same tenant; a global max()
          #     would let one fresh staging backup hold this rule Normal while
          #     production dumps rot. Alloy stamps `deployment` from
          #     DEPLOYMENT_NAME (infra/alloy/config.alloy); before that config
          #     reaches a VM the label is empty, which is one instance — today's
          #     behaviour. `instance` would not do: it is the alloy container id.
          #   • subtracting openmentor_db_backup_max_age_seconds instead of
          #     comparing against a literal, so changing BACKUP_MAX_AGE_HOURS in
          #     .env.production moves the alert with it. Result is "seconds past
          #     the window", hence the `> 0` threshold below.
          #   • `a or b` unions two differently-named gauges (no label set can
          #     match), so max() is the NEWEST of: the last success, and the
          #     sidecar's first start on this volume. A fresh volume therefore
          #     gets one grace window without .last_success ever claiming a dump
          #     that never ran — it stays 0, which the `> 0` filter drops.
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: '(time() - max by (deployment) (openmentor_db_backup_last_success_timestamp_seconds > 0 or openmentor_db_backup_first_start_timestamp_seconds)) - max by (deployment) (openmentor_db_backup_max_age_seconds)'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: om-db-backup-pipeline-absent
        title: DatabaseBackupPipelineAbsent
        condition: B
        # 15 evaluations at the group's 1m interval: long enough to ride out an
        # Alloy restart (a deploy does restart it when config.alloy changes) or a
        # VM reboot, short enough that a dead pipeline is caught the same hour.
        for: 15m
        # noDataState: OK is correct HERE and nowhere else in this file. The query
        # is absent()-based, so an empty result is the HEALTHY case — every
        # expected deployment is publishing. Alerting would page forever. A
        # datasource that is broken rather than empty lands in execErrState.
        noDataState: OK
        execErrState: Error
        labels: { severity: critical, team: openmentor }
        annotations:
          summary: "Backup gauges for deployment {{ $labels.deployment }} have disappeared"
          description: "Deployment {{ $labels.deployment }} has stopped remote-writing at least one openmentor_db_backup_* gauge, so DatabaseBackupStale can no longer evaluate it: that rule's instance for this deployment ceases to exist instead of firing, because noDataState applies to an empty query result and not to a label value that vanished while other deployments keep reporting. Likely causes: the postgres-backup sidecar is gone or crash-looping, the openmentor-backup-metrics volume is unmounted or unwritable, Alloy's textfile collector or its remote_write is broken, or DEPLOYMENT_NAME changed on the VM. Check `docker ps` and `docker logs openmentor-postgres-backup`, then `docker logs grafana-alloy`, and confirm with `count by (deployment) (openmentor_db_backup_last_success_timestamp_seconds)`. Runbook: docs/runbooks/postgres-backup-restore.md."
        data:
          # One absent() term per gauge per EXPECTED deployment. Three properties
          # are load-bearing, and infra/alert-consistency-test.sh enforces each:
          #
          #   • absent() gives a per-deployment instance because it propagates the
          #     equality matcher: absent(m{deployment="production"}) returns
          #     {deployment="production"} 1 (verified against this tenant
          #     2026-08-03). A regex matcher would NOT — it yields one unlabelled
          #     row, and only once EVERY deployment is gone, which is precisely
          #     the blind spot this rule exists to remove.
          #   • every gauge om-db-backup-stale reads gets its own term. That
          #     rule's expression joins them on `deployment`, so a SINGLE missing
          #     gauge (e.g. a sidecar too old to publish max_age_seconds) drops
          #     the whole deployment out of it just as completely.
          #   • the expected list is written down, because "which deployments
          #     ought to exist" cannot be derived from the metrics — that is the
          #     whole problem. Adding a deploy target means adding it to one of
          #     the two lists below; the test fails until it is in exactly one.
          #
          # expected-deployments: production
          # absence-not-expected: staging, local
          #   staging — ./deploy.sh --staging creates and destroys that VM, so an
          #     absence rule for it would page on every intentional teardown.
          #   local — infra/deploy-dev.sh sets DEPLOYMENT_NAME=local, and the dev
          #     overlay runs neither postgres-backup nor (by default) alloy, so
          #     nothing local ever reaches this tenant.
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: 'absent(openmentor_db_backup_last_success_timestamp_seconds{deployment="production"}) or absent(openmentor_db_backup_first_start_timestamp_seconds{deployment="production"}) or absent(openmentor_db_backup_max_age_seconds{deployment="production"})'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]
