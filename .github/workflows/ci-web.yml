name: CI / Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'

  # Allows manual trigger from Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

# SECURITY (L6): least-privilege default token for this workflow.
permissions:
  contents: read

# Lint, type check and tests are NOT here: they live in checks.yml
# ("required-checks"), which runs them on every PR. Duplicating them here meant
# every web PR ran the identical make targets twice on two runners.

jobs:
  # Build the application
  build:
    name: Build
    runs-on: ubuntu-latest

    # Plain CI values, not secrets: every NEXT_PUBLIC_* var is public by
    # definition (baked into the client bundle), and literals keep the build
    # reproducible and working on fork PRs where secrets are unavailable.
    # Real values are injected by the deploy pipeline (deploy.yml).
    env:
      NEXT_PUBLIC_GO_API_URL: http://localhost:8081
      NEXT_PUBLIC_S3_STORAGE_ENDPOINT: s3.eu-central-1.amazonaws.com
      NEXT_PUBLIC_S3_STORAGE_BUCKET: mentor-images
      # Cloudflare's official always-pass Turnstile test site key
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_ANALYTICS_PROVIDER: none
      NEXT_PUBLIC_APP_ENV: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        run: make install

      - name: Build application
        run: make build

  # Docker image build + runtime smoke test.
  #
  # `build` above compiles the app with the runner's Node (setup-node above),
  # which is NOT the Node the image ships. Without this job nothing in CI ever
  # executed web/Dockerfile, so a base-image bump could only be validated by
  # deploying it. This catches: the pinned node:*-alpine tag existing, yarn
  # --frozen-lockfile resolving under it, native deps (sharp) having binaries
  # for that ABI, the standalone output copying correctly, and the server
  # actually booting and serving on that Node major.
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same public literals as the build job: NEXT_PUBLIC_* is baked into the
      # client bundle, so nothing here is a secret and fork PRs still work.
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          load: true
          tags: openmentor-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GO_API_URL=http://localhost:8081
            NEXT_PUBLIC_S3_STORAGE_ENDPOINT=s3.eu-central-1.amazonaws.com
            NEXT_PUBLIC_S3_STORAGE_BUCKET=mentor-images
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
            NEXT_PUBLIC_ANALYTICS_PROVIDER=none
            NEXT_PUBLIC_APP_ENV=development

      - name: Verify image runs on its own Node
        run: |
          set -euo pipefail
          IMAGE=openmentor-web:${{ github.sha }}

          # Assert the shipped Node satisfies package.json "engines.node".
          # A Dockerfile base bump that outruns the declared engine range is
          # exactly the drift this job exists to catch.
          IMAGE_NODE=$(docker run --rm --entrypoint node "$IMAGE" -p 'process.versions.node')
          echo "image node: $IMAGE_NODE"
          docker run --rm -v "$PWD/web/package.json:/p.json:ro" --entrypoint node "$IMAGE" -e '
            const {engines} = require("/p.json");
            const want = engines && engines.node;
            if (!want) { console.log("no engines.node declared, skipping"); process.exit(0); }
            const clauses = want.split("||").map(s => s.trim());
            // Only assert on the simple "22.x" / "22 || 24" forms this repo
            // uses. Anything richer (ranges, carets) needs a real semver
            // parser, so skip rather than fail on a shape we cannot read.
            if (!clauses.every(c => /^\d+(\.x)?$/.test(c))) {
              console.log(`engines.node "${want}" is not a plain major list, skipping`);
              process.exit(0);
            }
            const major = process.versions.node.split(".")[0];
            if (!clauses.some(c => c.replace(/\.x$/, "") === major)) {
              console.error(`::error::image ships Node ${process.versions.node} but web/package.json engines.node is "${want}" — bump engines (and the CI node-version pins) together with the Dockerfile base image`);
              process.exit(1);
            }
            console.log(`node ${process.versions.node} satisfies engines.node "${want}"`);
          '

      - name: Smoke test image (boot + healthcheck)
        run: |
          set -euo pipefail
          IMAGE=openmentor-web:${{ github.sha }}

          docker run -d --name web -p 3000:3000 \
            -e NEXT_PUBLIC_GO_API_URL=http://localhost:8081 \
            -e GO_API_INTERNAL_TOKEN=ci-internal-token \
            -e METRICS_AUTH_TOKEN=ci-metrics-token \
            "$IMAGE"

          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/healthcheck >/dev/null && break
            [ "$i" = 30 ] && { echo "web never became healthy"; docker logs web; exit 1; }
            sleep 2
          done

          echo "--- healthcheck"
          curl -fsS http://localhost:3000/api/healthcheck

          echo "--- logs (for the record)"
          docker logs web

          docker rm -f web
