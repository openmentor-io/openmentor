version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - commentedOutCode
        - whyNoLint
        - unnamedResult
        - ifElseChain
        - octalLiteral
        - paramTypeCombine
        # Perf checks that only fire on our domain structs (Mentor ~200B,
        # Config ~128B). Copying those is irrelevant next to the DB/HTTP call
        # in the same function, and switching to pointers everywhere would
        # invite aliasing bugs in the job handlers for no measurable gain.
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - performance
        - style
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
        - G115
      severity: medium
      confidence: medium
    govet:
      disable:
        - fieldalignment
        # `shadow` is off by default in `go vet` because it flags the most
        # idiomatic error form in the language — `if err := f(); err != nil`
        # inside a function that already has an `err`. Same reasoning as
        # fieldalignment above: pedantic, and "fixing" it makes code worse.
        - shadow
      enable-all: true
    misspell:
      locale: US
    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: var-naming
          disabled: true
    whitespace:
      multi-if: true
      multi-func: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
          # Test helpers legitimately take a parameter that every call site
          # happens to pass the same value for — that's the helper being
          # reusable, not dead weight.
          - unparam
        path: _test\.go
      # Structurally-parallel code: same shape by design, different
      # collaborators. Collapsing these into a shared abstraction would hide
      # what each one actually does.
      - linters:
          - dupl
        path: internal/handlers/(contact|registration)_handler\.go
      - linters:
          - dupl
        path: internal/handlers/admin_mentors_handler\.go
      - linters:
          - dupl
        path: internal/worker/job_(sessions_watcher|update_status_reminder)\.go
      - linters:
          - all
        path: .*\.pb\.go
      - linters:
          - staticcheck
        text: 'SA9003:'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
