name: 🐛 Bug report
description: Something on openmentor.io or in this repo is broken or behaving wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **If this is a security vulnerability, stop here** and report it privately
        instead — see [SECURITY.md](https://github.com/openmentor-io/openmentor/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: |
        I clicked "Save" on my mentor profile and the page went blank.
        I expected it to save and show a confirmation.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we make it happen? Numbered steps are ideal.
      placeholder: |
        1. Log in as a mentor
        2. Go to /mentor/profile
        3. Paste a long description into the editor
        4. Click Save
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      description: A best guess is fine — leave it as "Not sure" if you don't know.
      options:
        - Not sure
        - Website / UI (web)
        - API / backend (api)
        - Emails or background jobs (worker)
        - Deployment / infrastructure (infra)
        - Documentation
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS if it's a website issue; versions and how you're running it if it's local.
      placeholder: |
        Firefox 141 on macOS 15 — happens on openmentor.io
        (or) Local stack via infra/deploy-dev.sh, Go 1.26, Node 26.5

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, or logs. Please redact personal data and tokens first.
